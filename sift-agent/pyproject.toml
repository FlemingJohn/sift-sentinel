[project]
name = "sift-agent"
version = "0.2.0"
description = "Claude Agent SDK forensic incident response controller over SIFT MCP servers"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_sdk"]
